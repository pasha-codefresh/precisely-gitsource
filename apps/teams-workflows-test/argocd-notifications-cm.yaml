apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # Teams service configuration
  # Note: Webhook type is automatically detected based on URL pattern
  # - Power Automate Workflows: api.powerautomate.com, api.powerplatform.com, flow.microsoft.com
  # - Office 365 Connectors: webhook.office.com (deprecated, retiring March 31, 2026)
  service.teams: |
    recipientUrls:
      channelName: $channel-workflows-url

  # Trigger configuration
  # Note: To use the Adaptive Cards template (for Workflows), change 'app-sync-succeeded' 
  # to 'app-sync-succeeded-workflows' in the send list below
  trigger.on-sync-succeeded: |
    - description: Application syncing has succeeded
      oncePer: app.status.operationState?.syncResult?.revision
      send:
      - app-sync-succeeded  # Uses MessageCard format - FAILS with Workflows, works with Office 365 Connectors
      # - app-sync-succeeded-workflows  # Uses Adaptive Cards format - WORKS with Workflows
      when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded']

  # Templates with teams support
  # 
  # ISSUE: When using Power Automate Workflows (api.powerautomate.com, etc.),
  # the default MessageCard format generated by notifications-engine does NOT work.
  # Workflows requires Adaptive Cards format with an 'attachments' array.
  #
  # Error you'll see in Teams Workflow failed run details:
  # "The execution of template action 'Send_each_adaptive_card' failed: 
  #  the result of the evaluation of 'foreach' expression '@triggerOutputs()?['body']?['attachments']' 
  #  is of type 'Null'. The result must be a valid array."
  #
  # This template uses the default MessageCard format (works with Office 365 Connectors,
  # but FAILS with Power Automate Workflows):
  template.app-sync-succeeded: |
    teams:
      facts: |
        [{
          "name": "Sync Status",
          "value": "{{.app.status.sync.status}}"
        },{
          "name": "Synced at",
          "value": "{{.app.status.operationState.finishedAt}}"
        },{
          "name": "Repository",
          "value": "{{.app.spec.source.repoURL}}"
        }]
      themeColor: '#000080'
      title: Application {{.app.metadata.name}} has been successfully synced
      text: Application {{.app.metadata.name}} has been successfully synced at {{.app.status.operationState.finishedAt}}.
      summary: "{{.app.metadata.name}} sync succeeded"

  # WORKAROUND: Use the 'template' field to provide Adaptive Cards format for Workflows.
  # This template will work with Power Automate Workflows:
  template.app-sync-succeeded-workflows: |
    teams:
      template: |
        {
          "type": "message",
          "attachments": [
            {
              "contentType": "application/vnd.microsoft.card.adaptive",
              "content": {
                "type": "AdaptiveCard",
                "version": "1.4",
                "body": [
                  {
                    "type": "TextBlock",
                    "text": "Application {{.app.metadata.name}} has been successfully synced",
                    "size": "Large",
                    "weight": "Bolder",
                    "color": "Good"
                  },
                  {
                    "type": "FactSet",
                    "facts": [
                      {
                        "title": "Sync Status",
                        "value": "{{.app.status.sync.status}}"
                      },
                      {
                        "title": "Synced at",
                        "value": "{{.app.status.operationState.finishedAt}}"
                      },
                      {
                        "title": "Repository",
                        "value": "{{.app.spec.source.repoURL}}"
                      }
                    ]
                  },
                  {
                    "type": "TextBlock",
                    "text": "Application {{.app.metadata.name}} has been successfully synced at {{.app.status.operationState.finishedAt}}.",
                    "wrap": true
                  }
                ]
              }
            }
          ]
        }