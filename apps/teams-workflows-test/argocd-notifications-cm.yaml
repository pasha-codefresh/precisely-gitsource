apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # Teams service configuration
  # Note: Webhook type is automatically detected based on URL pattern
  # - Power Automate Workflows: api.powerautomate.com, api.powerplatform.com, flow.microsoft.com
  # - Office 365 Connectors: webhook.office.com (deprecated, retiring March 31, 2026)
  service.teams-workflows: |
    recipientUrls:
      channelName: $channel-workflows-url

  # Trigger configuration
  # Note: For Power Automate Workflows the Teams service now always sends Adaptive Cards
  # and automatically wraps them into the required "message" + "attachments" envelope.
  trigger.on-sync-succeeded: |
    - description: Application syncing has succeeded
      oncePer: app.status.operationState?.syncResult?.revision
      send:
      # - app-sync-succeeded  # MessageCard format (for legacy Office 365 Connectors)
      - app-sync-succeeded-workflows  # Adaptive Card format (for Power Automate Workflows)
      when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded']

  # Templates with teams support
  #
  # This template uses the default MessageCard format (for legacy Office 365 Connectors):
  template.app-sync-succeeded: |
    teams-workflows:
      facts: |
        [{
          "name": "Sync Status",
          "value": "{{.app.status.sync.status}}"
        },{
          "name": "Synced at",
          "value": "{{.app.status.operationState.finishedAt}}"
        },{
          "name": "Repository",
          "value": "{{.app.spec.source.repoURL}}"
        }]
      themeColor: '#000080'
      title: Application {{.app.metadata.name}} has been successfully synced
      text: Application {{.app.metadata.name}} has been successfully synced at {{.app.status.operationState.finishedAt}}.
      summary: "{{.app.metadata.name}} sync succeeded"

  # Power Automate Workflows template.
  # The notifications engine now always generates an Adaptive Card payload for
  # Teams Workflows and wraps it into the "message" + "attachments" envelope.
  # Here we just provide the high-level fields; the engine builds the JSON.
  template.app-sync-succeeded-workflows: |
    teams-workflows:
      facts: |
        [{
          "name": "Sync Status",
          "value": "{{.app.status.sync.status}}"
        },{
          "name": "Synced at",
          "value": "{{.app.status.operationState.finishedAt}}"
        },{
          "name": "Repository",
          "value": "{{.app.spec.source.repoURL}}"
        }]
      # "Good" maps to the green success color in Adaptive Cards
      themeColor: 'Good'
      title: Application {{.app.metadata.name}} has been successfully synced
      text: Application {{.app.metadata.name}} has been successfully synced at {{.app.status.operationState.finishedAt}}.